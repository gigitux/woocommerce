name: Nightly retry smoke
run-name: 'Nightly retry smoke: pass on attempt ${{ inputs.pass_on_attempt }}'
'on':
  workflow_dispatch:
    inputs:
      pass_on_attempt:
        description: First successful attempt (99 = always fail)
        required: true
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '99'
        default: '3'
      trigger:
        description: CI trigger used by the production notification condition
        type: string
        default: nightly-checks
permissions:
  contents: read
jobs:
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Independent successful job
        run: echo "STABLE_ATTEMPT=$GITHUB_RUN_ATTEMPT"
  flaky:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Controlled failure
        run: |-
          echo "TEST_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          test "$GITHUB_RUN_ATTEMPT" -ge "$PASS_ON_ATTEMPT"
        env:
          PASS_ON_ATTEMPT: ${{ inputs.pass_on_attempt }}
      - name: Create test report
        run: echo "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/retry-smoke-result.txt"
        if: ${{ always() }}
      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: retry-smoke-result
          path: ${{ runner.temp }}/retry-smoke-result.txt
          overwrite: true
          retention-days: 1
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - stable
      - flaky
    if: ${{ !cancelled() }}
    steps:
      - name: Evaluate results
        run: test "$FLAKY_RESULT" = "success"
        env:
          FLAKY_RESULT: ${{ needs.flaky.result }}
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - stable
      - flaky
      - evaluate
    if: |-
      ${{ !cancelled() && github.event_name != 'pull_request' && github.repository == 'gigitux/woocommerce' &&
          ( inputs.trigger != 'nightly-checks' || github.event_name != 'workflow_dispatch' || github.run_attempt >= 3 ) }}
    steps:
      - name: Log notification decision without Slack
        run: |-
          if [ "$FLAKY_RESULT" = "failure" ]; then
            echo "WOULD_NOTIFY_SLACK attempt=$GITHUB_RUN_ATTEMPT"
          else
            echo "NO_SLACK_NOTIFICATION attempt=$GITHUB_RUN_ATTEMPT"
          fi
        env:
          FLAKY_RESULT: ${{ needs.flaky.result }}
